<text class="sub" x="592.0" y="440">DSP48E1</text>
<rect class="edge" x="20" y="130" width="46" height="322" rx="4"/>
<text class="name" transform="translate(48,291.0) rotate(-90)">a_in: one vector per cycle (N bytes)</text>
<rect class="edge" x="88" y="130" width="46" height="322" rx="4"/>
<text class="name" transform="translate(116,291.0) rotate(-90)">extend to 9 bits (act_signed)</text>
<text class="note" x="150" y="122">input skew</text>
<line x1="66" y1="166" x2="88" y2="166" stroke="#ea580c" stroke-width="1.6"/>
<path class="act" d="M134,166 L260,166"/>
<text class="note" x="150" y="154">+0</text>
<line x1="66" y1="256" x2="88" y2="256" stroke="#ea580c" stroke-width="1.6"/>
<path class="act" d="M134,256 L260,256"/>
<rect class="reg" x="202" y="249" width="14" height="14"/>
<text class="note" x="150" y="244">+1</text>
<line x1="66" y1="346" x2="88" y2="346" stroke="#ea580c" stroke-width="1.6"/>
<path class="act" d="M134,346 L260,346"/>
<rect class="reg" x="202" y="339" width="14" height="14"/>
<rect class="reg" x="182" y="339" width="14" height="14"/>
<text class="note" x="150" y="334">+2</text>
<line x1="66" y1="436" x2="88" y2="436" stroke="#ea580c" stroke-width="1.6"/>
