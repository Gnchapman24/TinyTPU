<rect class="reg" x="182" y="429" width="14" height="14"/>
<rect class="reg" x="162" y="429" width="14" height="14"/>
<text class="note" x="150" y="424">+3</text>
<text class="note" x="140" y="482">output de-skew</text>
<path class="psum" d="M292.0,452 L292.0,552"/>
<rect class="reg" x="285.0" y="466" width="14" height="14"/>
<rect class="reg" x="285.0" y="486" width="14" height="14"/>
<rect class="reg" x="285.0" y="506" width="14" height="14"/>
<text class="note" x="304.0" y="478">+3</text>
<path class="psum" d="M392.0,452 L392.0,552"/>
<rect class="reg" x="385.0" y="466" width="14" height="14"/>
<rect class="reg" x="385.0" y="486" width="14" height="14"/>
<text class="note" x="404.0" y="478">+2</text>
<path class="psum" d="M492.0,452 L492.0,552"/>
<rect class="reg" x="485.0" y="466" width="14" height="14"/>
<text class="note" x="504.0" y="478">+1</text>
<path class="psum" d="M592.0,452 L592.0,552"/>
<text class="note" x="604.0" y="478">+0</text>
<rect class="edge" x="230" y="552" width="394" height="28" rx="4"/>
<text class="name" x="427.0" y="570">out_data: N × INT32 (low 32 bits of each 48-bit column sum), out_valid</text>
<text class="note" x="652" y="134" font-weight="bold" fill="#111827">Weights (blue)</text>
<text class="note" x="652" y="150">Loaded one tile row per cycle:</text>
<text class="note" x="652" y="166">row i captures its column</text>
<text class="note" x="652" y="182">buses when w_load is high</text>
<text class="note" x="652" y="198">and w_row = i. They then stay</text>
<text class="note" x="652" y="214">in each DSP's B register.</text>
<text class="note" x="652" y="246" font-weight="bold" fill="#111827">Activations (orange)</text>
<text class="note" x="652" y="262">Move one PE right per cycle;</text>
<text class="note" x="652" y="278">row i starts i cycles late,</text>
<text class="note" x="652" y="294">so element i meets the partial</text>
<text class="note" x="652" y="310">sum of its column on time.</text>
<text class="note" x="652" y="342" font-weight="bold" fill="#111827">Partial sums (black)</text>
<text class="note" x="652" y="358">Flow one PE down per cycle</text>
<text class="note" x="652" y="374">on the DSP cascade</text>
<text class="note" x="652" y="390">(PCOUT → PCIN, 48 bits).</text>
<text class="note" x="652" y="406">Column j finishes j cycles</text>
<text class="note" x="652" y="422">after column 0; the de-skew</text>
<text class="note" x="652" y="438">lines realign them.</text>
<text class="note" x="652" y="470" font-weight="bold" fill="#111827">Latency: 2N + 1 cycles</text>
<text class="note" x="652" y="486">from a_in to out_data.</text>
</svg>
