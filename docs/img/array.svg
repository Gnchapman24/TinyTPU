    .act  { stroke: #ea580c; stroke-width: 1.6; fill: none; marker-end: url(#ao); }
    .psum { stroke: #111827; stroke-width: 2.2; fill: none; marker-end: url(#ak); }
    .wbus { stroke: #2563eb; stroke-width: 1.2; fill: none; stroke-dasharray: 5 3; }
    .wtap { stroke: #2563eb; stroke-width: 1.2; fill: none; marker-end: url(#ab); }
  </style>
