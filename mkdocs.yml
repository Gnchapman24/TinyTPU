site_name: TinyTPU
site_description: A minimal INT8 Tensor Processing Unit for the Digilent Basys3
repo_url: https://github.com/Gnchapman24/TinyTPU
edit_uri: ""

docs_dir: docs
site_dir: site
theme:
  name: mkdocs

# docs/rtl/ is generated by docs/gen_rtl_docs.py (run by `make docs`); don't edit it.
# Pages for the ISA, UART protocol, memory map and architecture are added with their
# Phase 1 / Phase 6 tasks.
nav:
  - Home: index.md
  - ISA: isa.md
  - UART protocol: uart_protocol.md
  - Memory map: memory_map.md
  - Board bring-up: bringup.md
  - RTL modules: rtl/index.md
  - Python API:
      - tinytpu.isa: api/isa.md
      - tinytpu.crc: api/crc.md
      - tinytpu.packet: api/packet.md
      - tinytpu.link: api/link.md
      - tinytpu.bringup: api/bringup.md

# Python API pages use `::: module.path` blocks (Google-style docstrings).
plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [host]
          options:
            docstring_style: google
            show_source: false

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true

exclude_docs: |
  *.py

validation:
  nav:
    omitted_files: info
    not_found: warn
  links:
    not_found: warn
    anchors: warn
